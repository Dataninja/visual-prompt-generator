<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Prompt Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#160F41; --corallo:#D17A66; --giallo:#F5D973; --viola:#402058;
  --azzurro:#00ADEE; --verde:#0FA396;
  --bg:#FFFFFF; --testo:#160F41; --testo2:#402058;
  --card:#FFFFFF; --bordo:#E4E1EC; --chip:#FFFFFF; --chipBordo:#CFCADC;
  --pannello:#FAF9FC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120C33; --testo:#F3F1F8; --testo2:#C9C2DF;
    --card:#1B1348; --bordo:#33285F; --chip:#1B1348; --chipBordo:#40357A;
    --pannello:#180F40;
  }
}
:root[data-theme="dark"]{
  --bg:#120C33; --testo:#F3F1F8; --testo2:#C9C2DF;
  --card:#1B1348; --bordo:#33285F; --chip:#1B1348; --chipBordo:#40357A;
  --pannello:#180F40;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--testo);
  font-family:"Work Sans","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:28px 20px 64px}
header h1{font-size:1.65rem; font-weight:700; margin:0 0 4px; letter-spacing:-.01em}
header .sottotesto{font-size:1.02rem; font-weight:600; color:var(--corallo); margin:0}
header p{margin:0; color:var(--testo2); max-width:62ch}
.rule{height:3px; width:44px; background:var(--giallo); border-radius:2px; margin:0 0 18px}

/* passi */
.steps{display:flex; gap:8px; flex-wrap:wrap; margin:26px 0 20px}
.step{
  flex:1 1 140px; min-width:120px; display:flex; align-items:center; gap:10px;
  background:var(--card); border:1.5px solid var(--bordo); border-radius:12px;
  padding:10px 12px; cursor:pointer; text-align:left; color:var(--testo);
  font-family:inherit; font-size:.82rem; font-weight:600; line-height:1.25;
  transition:border-color .15s, background .15s;
}
.step:hover{border-color:var(--corallo)}
.step[aria-current="true"]{border-color:var(--corallo); background:color-mix(in srgb, var(--corallo) 10%, var(--card))}
.step.done .n{background:var(--corallo); color:#fff; border-color:var(--corallo)}
.step img{width:26px; height:26px; flex:0 0 26px}
.step .n{
  display:inline-flex; width:22px; height:22px; flex:0 0 22px; border-radius:50%;
  border:1.5px solid var(--chipBordo); background:var(--card);
  font-size:.72rem; font-weight:700; align-items:center; justify-content:center;
}
.step .lbl{flex:1; min-width:0}
.avanz{display:flex; align-items:center; gap:12px; margin:0 0 22px}
.track{flex:1; height:6px; border-radius:99px; background:var(--bordo); overflow:hidden}
.fill{height:100%; background:var(--corallo); border-radius:99px; width:20%; transition:width .25s}
#avanzTxt{font-size:.8rem; font-weight:600; color:var(--testo2); white-space:nowrap}
.kicker{margin:0 0 3px !important; font-size:.72rem; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--corallo) !important}
.finito{margin-top:18px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--corallo);
  background:color-mix(in srgb, var(--corallo) 10%, var(--card)); font-size:.9rem}

/* griglia */
.grid{display:grid; grid-template-columns:1fr; gap:22px}
@media(min-width:900px){ .grid{grid-template-columns:1.18fr .82fr; align-items:start} }

.card{background:var(--card); border:1.5px solid var(--bordo); border-radius:16px; padding:22px}
.card-head{display:flex; gap:14px; align-items:flex-start; margin-bottom:6px}
.card-head img{width:46px; height:46px; flex:0 0 46px}
.card-head h2{margin:0; font-size:1.2rem; font-weight:700}
.card-head p{margin:2px 0 0; color:var(--testo2); font-size:.92rem}

.group{margin-top:22px; padding-top:18px; border-top:1px solid var(--bordo)}
.group:first-of-type{border-top:0; padding-top:4px}
.group h3{margin:0 0 2px; font-size:.78rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--corallo)}
.group .hint{margin:0 0 10px; font-size:.8rem; color:var(--testo2)}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px}
.chip{
  font-family:inherit; font-size:.86rem; line-height:1.2; color:var(--testo);
  background:var(--chip); border:1.5px solid var(--chipBordo); border-radius:999px;
  padding:7px 13px; cursor:pointer; transition:.15s;
}
.chip:hover:not(:disabled){border-color:var(--corallo)}
.chip[aria-pressed="true"]{background:var(--corallo); border-color:var(--corallo); color:#fff; font-weight:600}
.chip:disabled{opacity:.35; cursor:not-allowed; text-decoration:line-through}
input[type=text]{
  width:100%; font-family:inherit; font-size:.92rem; color:var(--testo);
  background:var(--pannello); border:1.5px solid var(--chipBordo); border-radius:10px;
  padding:9px 12px;
}
input[type=text]:focus{outline:none; border-color:var(--corallo)}
.warn{margin-top:8px; font-size:.78rem; color:var(--testo2)}

/* regole fisse */
.fisse{margin-top:22px; padding:14px 16px; border-radius:12px;
  background:color-mix(in srgb, var(--giallo) 26%, var(--card)); border:1.5px solid var(--giallo)}
:root[data-theme="dark"] .fisse, :root:not([data-theme="light"]) .fisse{color:var(--indigo)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fisse{color:#160F41}}
.fisse h4{margin:0 0 6px; font-size:.78rem; letter-spacing:.07em; text-transform:uppercase}
.fisse ul{margin:0; padding-left:18px; font-size:.86rem}

/* navigazione */
.nav{display:flex; gap:10px; margin-top:24px}
.btn{
  font-family:inherit; font-size:.92rem; font-weight:600; border-radius:10px;
  padding:11px 18px; cursor:pointer; border:1.5px solid var(--corallo); transition:.15s;
}
.btn-p{background:var(--corallo); color:#fff}
.btn-p:hover{filter:brightness(1.07)}
.btn-s{background:transparent; color:var(--corallo)}
.btn-s:hover{background:color-mix(in srgb, var(--corallo) 12%, transparent)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.nav .spacer{flex:1}

/* anteprima */
.preview{position:sticky; top:20px; background:var(--card); border:1.5px solid var(--bordo); border-radius:16px; padding:20px}
.preview h2{margin:0 0 12px; font-size:1.05rem; font-weight:700}
.tabs{display:flex; gap:6px; margin-bottom:12px}
.tab{font-family:inherit; font-size:.8rem; font-weight:600; padding:6px 13px; border-radius:999px;
  border:1.5px solid var(--chipBordo); background:transparent; color:var(--testo); cursor:pointer}
.tab[aria-selected="true"]{background:var(--indigo); border-color:var(--indigo); color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--giallo); border-color:var(--giallo); color:#160F41}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--giallo); border-color:var(--giallo); color:#160F41}}
.out{
  background:var(--pannello); border:1.5px solid var(--bordo); border-radius:12px;
  padding:14px; font-size:.9rem; line-height:1.55; min-height:130px;
  max-height:340px; overflow-y:auto; white-space:pre-wrap; word-break:break-word;
}
.out .vuoto{color:var(--testo2); font-style:italic}
.meta{margin-top:10px; font-size:.76rem; color:var(--testo2); display:flex; justify-content:space-between; gap:10px}
.pact{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.mancanti{margin-top:12px; font-size:.8rem; color:var(--testo2)}
.mancanti b{color:var(--corallo)}
.verifica{margin-top:14px; padding:13px 15px; border-radius:12px; background:var(--pannello);
  border:1.5px solid var(--bordo); border-left:4px solid var(--corallo)}
.verifica h3{margin:0 0 7px; font-size:.74rem; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--corallo)}
.verifica ul{margin:0; padding-left:17px; font-size:.83rem; line-height:1.45; color:var(--testo2)}
.verifica li+li{margin-top:5px}
.verifica li b{color:var(--testo); font-weight:600}
footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--bordo); font-size:.78rem; color:var(--testo2)}
footer a{color:var(--corallo); font-weight:600; text-decoration:none; border-bottom:1px solid currentColor}
footer a:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="rule"></div>
  <h1>Visual Prompt Generator</h1>
  <p class="sottotesto">Cinque passaggi per creare un buon prompt visivo</p>
</header>

<div class="steps" id="steps" role="tablist"></div>
<div class="avanz"><div class="track"><div class="fill" id="fill"></div></div><span id="avanzTxt"></span></div>

<div class="grid">
  <main class="card" id="card"></main>
  <aside class="preview">
    <h2>Il tuo prompt</h2>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-lang="it" aria-selected="true">Italiano</button>
      <button class="tab" role="tab" data-lang="en" aria-selected="false">English</button>
    </div>
    <div class="out" id="out"></div>
    <div class="meta"><span id="conta"></span><span id="parole"></span></div>
    <div class="pact">
      <button class="btn btn-p" id="copia">Copia</button>
      <button class="btn btn-s" id="azzera">Ricomincia</button>
    </div>
    <div class="mancanti" id="mancanti"></div>
    <div id="verifica"></div>
  </aside>
</div>

<footer>Open the Box è un progetto di Dataninja. Più info su <a href="https://openthebox.io/" target="_blank" rel="noopener">www.openthebox.io</a></footer>
</div>

const CHIAVE = "otb-compositore-v1";
let stato = {passo:0, lang:"it", sel:{}, libero:{}};
try{ const s = localStorage.getItem(CHIAVE); if(s){ const p = JSON.parse(s); if(p && p.sel) stato = Object.assign(stato, p); } }catch(e){}
function salva(){ try{ localStorage.setItem(CHIAVE, JSON.stringify(stato)); }catch(e){} }

function opzioniResa(){
  const r = (stato.sel["registro"]||[])[0];
  if(!r) return [];
  const opt = DATI[2].gruppi[0].opts.find(o=>o.l===r);
  return (opt && opt.kind==="foto") ? RESA_FOTO : RESA_ILLUS;
}
function gruppoOpts(g){ return g.dinamico ? opzioniResa() : g.opts; }

function bloccata(g, o){
  if(!o.id) return null;
  const sel = stato.sel;
  const has = (k,v)=> (sel[k]||[]).includes(v);
  if(o.id==="macro" && (has("distanza","Campo medio") || has("distanza","Campo lungo")))
    return "Un macro non convive con un campo medio o lungo.";
  if(o.id==="pdcAmpia" && has("composizione","Sfondo sfocato"))
    return "Hai chiesto lo sfondo fuori fuoco nell'inquadratura.";
  if(o.id==="pdcRidotta" && has("composizione","Sfondo a fuoco"))
    return "Hai chiesto lo sfondo a fuoco nell'inquadratura.";
  return null;
}

function toggle(gId, label, multi){
  const cur = stato.sel[gId] || [];
  if(multi) stato.sel[gId] = cur.includes(label) ? cur.filter(x=>x!==label) : cur.concat([label]);
  else stato.sel[gId] = cur.includes(label) ? [] : [label];
  if(gId==="registro") stato.sel["resa"] = [];
  salva(); render();
}

function frammenti(gId, lang){
  const sez = DATI.find(s=>s.gruppi.some(g=>g.id===gId));
  const g = sez.gruppi.find(g=>g.id===gId);
  const opts = gruppoOpts(g);
  const out = (stato.sel[gId]||[]).map(l=>{ const o=opts.find(x=>x.l===l); return o? o[lang] : null; }).filter(Boolean);
  const lib = (stato.libero[gId]||"").trim();
  if(lib) out.push(lib);
  return out;
}
const unisci = a => a.filter(Boolean).join(", ");

function componi(lang){
  const f = id => unisci(frammenti(id, lang));
  const frasi = [];
  let s = f("cosa");
  const ep = f("epoca"), det = f("dettaglio");
  if(ep) s = s ? s + ", " + ep : ep;
  if(det) s = s ? s + ", con " + det : det;
  if(s) frasi.push(s);
  const inq = unisci([f("distanza"), f("pdv"), f("composizione")]); if(inq) frasi.push(inq);
  const st  = unisci([f("registro"), f("resa"), f("realismo")]);    if(st)  frasi.push(st);
  const lu  = unisci([f("luce"), f("dominante"), f("atmosfera")]);  if(lu)  frasi.push(lu);
  const fo  = unisci([f("proporzioni"), f("destinazione"), f("leggibilita")]); if(fo) frasi.push(fo);
  if(stato.noTesto) frasi.push(lang==="it"
    ? "Nessun testo, nessuna scritta e nessuna didascalia dentro l'immagine"
    : "No text, lettering or captions inside the image");
  if(!frasi.length) return "";
  return frasi.map((x,i)=> i===0 ? x.charAt(0).toUpperCase()+x.slice(1) : x).join(". ") + ".";
}

function render(){
  const stepsEl = document.getElementById("steps");
  stepsEl.innerHTML = "";
  DATI.forEach((sez,i)=>{
    const b = document.createElement("button");
    b.className = "step" + (sez.gruppi.some(g=>(stato.sel[g.id]||[]).length || (stato.libero[g.id]||"").trim()) ? " done" : "");
    b.setAttribute("aria-current", i===stato.passo ? "true" : "false");
    const fatto = sez.gruppi.some(g=>(stato.sel[g.id]||[]).length || (stato.libero[g.id]||"").trim());
    b.innerHTML = '<span class="n">'+(fatto?"&#10003;":(i+1))+'</span><img src="'+ICONE[i]+'" alt=""><span class="lbl">'+sez.nome+'</span>';
    b.onclick = ()=>{ stato.passo=i; salva(); render(); };
    stepsEl.appendChild(b);
  });

  const sez = DATI[stato.passo];
  const card = document.getElementById("card");
  card.innerHTML = '<div class="card-head"><img src="'+ICONE[stato.passo]+'" alt=""><div>'
    + '<p class="kicker">Passo '+(stato.passo+1)+' di '+DATI.length+'</p>'
    + '<h2>'+sez.nome+'</h2></div></div>';

  sez.gruppi.forEach(g=>{
    const opts = gruppoOpts(g);
    const d = document.createElement("div");
    d.className = "group";
    let html = "<h3>"+g.nome+"</h3>";
    if(g.dinamico && !opts.length) html += '<p class="hint">Scegli prima un registro visivo: le opzioni di resa cambiano fra fotografia e illustrazione.</p>';
    else html += '<p class="hint">'+(g.sug || (g.multi ? "Puoi sceglierne più di una." : "Scegline una."))+'</p>';
    if(opts.length) html += '<div class="chips">';
    let motivi = [];
    opts.forEach(o=>{
      const on = (stato.sel[g.id]||[]).includes(o.l);
      const bl = bloccata(g,o);
      if(bl && !motivi.includes(bl)) motivi.push(bl);
      html += '<button class="chip" aria-pressed="'+on+'"'+(bl?' disabled title="'+bl+'"':'')+' data-g="'+g.id+'" data-l="'+o.l.replace(/"/g,'&quot;')+'" data-m="'+(g.multi?1:0)+'">'+o.l+'</button>';
    });
    if(opts.length) html += "</div>";
    if(g.ph!=="" || true) html += '<input type="text" data-lib="'+g.id+'" placeholder="'+(g.ph||"oppure scrivi tu")+'" value="'+((stato.libero[g.id]||"").replace(/"/g,'&quot;'))+'">';
    if(motivi.length) html += '<p class="warn">'+motivi.join(" ")+'</p>';
    d.innerHTML = html;
    card.appendChild(d);
  });

  if(stato.passo===DATI.length-1){
    const f = document.createElement("div");
    f.className = "fisse";
    f.innerHTML = '<h4>Regole fisse</h4><ul>'
      + '<li>Nessun testo dentro l\'immagine: etichette e didascalie si aggiungono dopo.</li>'
      + '<li>Nessun nome di persona reale e nessun nome di autore vivente.</li>'
      + '<li>Nessun riferimento a un film o a una serie da cui prendere le sembianze.</li></ul>'
      + '<div class="chips" style="margin:12px 0 0"><button class="chip" id="noTesto" aria-pressed="'+(!!stato.noTesto)+'">Aggiungi al prompt: nessun testo dentro l\'immagine</button></div>';
    card.appendChild(f);
    const fine = document.createElement("div");
    fine.className = "finito";
    fine.textContent = "Quinto e ultimo passaggio. Quando hai finito, il prompt completo è nel riquadro Il tuo prompt, in italiano e in inglese.";
    card.appendChild(fine);
  }

  const nav = document.createElement("div");
  nav.className = "nav";
  const ultimo = stato.passo===DATI.length-1;
  nav.innerHTML = '<button class="btn btn-s" id="prec"'+(stato.passo===0?" disabled":"")+'>'
    + (stato.passo===0 ? "Indietro" : "Indietro: "+DATI[stato.passo-1].nome) + '</button><span class="spacer"></span>'
    + '<button class="btn btn-p" id="succ">'
    + (ultimo ? "Vedi il prompt" : "Passo "+(stato.passo+2)+": "+DATI[stato.passo+1].nome) + '</button>';
  card.appendChild(nav);

  card.querySelectorAll(".chip[data-g]").forEach(b=> b.onclick = ()=> toggle(b.dataset.g, b.dataset.l, b.dataset.m==="1"));
  const nt = document.getElementById("noTesto");
  if(nt) nt.onclick = ()=>{ stato.noTesto = !stato.noTesto; salva(); render(); };
  card.querySelectorAll("input[data-lib]").forEach(inp=>{
    inp.oninput = ()=>{ stato.libero[inp.dataset.lib] = inp.value; salva(); aggiornaOut(); };
  });
  const p = document.getElementById("prec"), s = document.getElementById("succ");
  if(p) p.onclick = ()=>{ stato.passo=Math.max(0,stato.passo-1); salva(); render(); };
  if(s) s.onclick = ()=>{
    if(stato.passo===DATI.length-1){ document.querySelector(".preview").scrollIntoView({behavior:"smooth", block:"start"}); return; }
    stato.passo++; salva(); render(); window.scrollTo({top:0, behavior:"smooth"});
  };

  document.getElementById("fill").style.width = ((stato.passo+1)/DATI.length*100)+"%";
  document.getElementById("avanzTxt").textContent = "Passo "+(stato.passo+1)+" di "+DATI.length;
  document.querySelectorAll(".tab").forEach(t=> t.setAttribute("aria-selected", t.dataset.lang===stato.lang ? "true":"false"));
  aggiornaOut();
}

function aggiornaOut(){
  const testo = componi(stato.lang);
  const out = document.getElementById("out");
  out.innerHTML = testo ? "" : '<span class="vuoto">Scegli almeno un\'opzione e il prompt comincia a comporsi qui.</span>';
  if(testo) out.textContent = testo;
  const fatte = DATI.filter(s=>s.gruppi.some(g=>(stato.sel[g.id]||[]).length || (stato.libero[g.id]||"").trim())).length;
  document.getElementById("conta").textContent = fatte + " passaggi su " + DATI.length;
  document.getElementById("parole").textContent = testo ? testo.trim().split(/\s+/).length + " parole" : "";
  const mancano = DATI.filter(s=>!s.gruppi.some(g=>(stato.sel[g.id]||[]).length || (stato.libero[g.id]||"").trim())).map(s=>s.nome);
  document.getElementById("mancanti").innerHTML = mancano.length
    ? "Non hai ancora indicato: <b>"+mancano.join(", ")+"</b>. Quello che non specifichi lo sceglie il modello al posto tuo."
    : "Tutte e cinque le variabili sono indicate.";
  document.getElementById("verifica").innerHTML = mancano.length ? "" :
    '<div class="verifica"><h3>Controlla il risultato</h3><ul>'
    + '<li><b>Ci sono stereotipi?</b> Guarda che aspetto, genere, età e provenienza il modello ha dato per scontati senza che tu li avessi chiesti.</li>'
    + '<li><b>Ci sono dettagli sbagliati?</b> Mani, scritte, oggetti fuori epoca, numeri, proporzioni: sono i punti in cui i modelli sbagliano più spesso.</li>'
    + '<li><b>Dichiara che è stata creata con l\'IA.</b> È un atto di trasparenza verso chi la guarderà.</li>'
    + '</ul></div>';
}

document.querySelectorAll(".tab").forEach(t=> t.onclick = ()=>{ stato.lang=t.dataset.lang; salva(); render(); });
document.getElementById("copia").onclick = async ()=>{
  const testo = componi(stato.lang); if(!testo) return;
  const b = document.getElementById("copia");
  try{ await navigator.clipboard.writeText(testo); b.textContent="Copiato"; }
  catch(e){ b.textContent="Copia non riuscita"; }
  setTimeout(()=> b.textContent="Copia", 1600);
};
document.getElementById("azzera").onclick = ()=>{
  stato = {passo:0, lang:stato.lang, sel:{}, libero:{}, noTesto:false};
  try{ localStorage.removeItem(CHIAVE); }catch(e){}
  render();
};
render();
</script>
